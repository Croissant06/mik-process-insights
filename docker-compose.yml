# Local development only. Not for public deployment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-mik_insights}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mik} -d ${POSTGRES_DB:-mik_insights}"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # bound to localhost only
    volumes:
      - ./app:/srv/app
      - ./questionnaire:/srv/questionnaire
    healthcheck:   # also checks the database connection
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  pgdata:
