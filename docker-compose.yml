# Local development only. Not for public deployment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-mik_insights}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mik} -d ${POSTGRES_DB:-mik_insights}"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # bound to localhost only
    volumes:
      - ./app:/srv/app
      - ./questionnaire:/srv/questionnaire
volumes:
  pgdata:
