{% extends "base.html" %}
{% block title %}Вход · MIK | Process Insights{% endblock %}
{% block head_extra %}<link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}">{% endblock %}
{% block content %}
<section class="card" style="max-width:440px;margin-inline:auto">
  <div class="card__body">
    <h1 style="margin-top:0">Вход за администратори</h1>
    {% if error %}<div class="banner banner--error" role="alert"><svg class="icon"><use href="#i-circle-alert"/></svg><span>{{ error }}</span></div>{% endif %}
    <form method="post" action="/admin/login" autocomplete="on">
      <div class="field">
        <label class="field__label" for="login">Потребителско име</label>
        <input class="input" id="login" name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" autofocus>
      </div>
      <div class="field">
        <label class="field__label" for="password">Парола</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
      </div>
      <button class="btn" type="submit">Вход</button>
    </form>
  </div>
</section>
{% endblock %}
