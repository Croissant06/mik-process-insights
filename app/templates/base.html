<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#14253D">
  <title>{% block title %}MIK | Process Insights{% endblock %}</title>
  <script>
    /* Apply the saved (or system) theme before first paint to avoid a flash. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("mik-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preload" href="{{ url_for('static', path='fonts/inter-cyrillic-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% include "_icons.html" %}
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="brand__name">MIK <span>| Process Insights</span></div>
        <div class="brand__tag">Заедно към по-ефективна работна среда.</div>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Смяна на светъл/тъмен режим">
        <svg class="icon icon-sun"><use href="#i-sun"/></svg>
        <svg class="icon icon-moon"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>
  <main class="container page">{% block content %}{% endblock %}</main>
  <footer class="foot">Вътрешна система на МИК-БГ · Информацията се използва само за анализ на процесите</footer>
  <script src="{{ url_for('static', path='js/theme.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
